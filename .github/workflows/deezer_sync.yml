name: Sincronizar Playlist Top 100 Atrasadas

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - run: pip install requests supabase

      - name: Rodar atualização da playlist
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEZER_ARL_COOKIE: ${{ secrets.DEEZER_ARL_COOKIE }}
        run: python sync_deezer.py
