name: Sincronizador Deezer & Playlist Atrasadas

on:
  schedule:
    # Executa diariamente às 03:00 UTC (00:00 Horário de Brasília)
    - cron: '0 3 * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub Actions

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Executar sincronização
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEZER_USER_ID: ${{ secrets.DEEZER_USER_ID }}
          DEEZER_ARL_COOKIE: ${{ secrets.DEEZER_ARL_COOKIE }}
        run: python sync_deezer.py
